name: CI Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Validation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Manifest Sync
        run: npm run verify:manifest-sync

      - name: Build packages and CLI
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit

  package-manager-matrix:
    name: Lifecycle & PM Matrix (${{ matrix.pm }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn, bun]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Bun
        if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Setup Yarn
        if: matrix.pm == 'yarn'
        run: corepack enable

      - name: Install root dependencies & build
        run: |
          npm ci
          npm run build

      - name: Run Smoke Tests with ${{ matrix.pm }}
        run: node scripts/smoke-test.mjs
        env:
          TEST_PM: ${{ matrix.pm }}

      - name: Run Integration Tests
        run: node scripts/integration-test.mjs
        env:
          TEST_PM: ${{ matrix.pm }}
