name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: false
        default: 'latest'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify workspace package versions are in sync
        run: npm run verify:versions-sync

      - name: Verify this version hasn't already been published
        run: npm run verify:not-published

      - run: npm run lint --if-present

      - run: npm run typecheck

      - run: npm run verify:manifest-sync

      - run: npm run build

      - run: node scripts/smoke-test.mjs

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")

          echo "Tag: $TAG"
          echo "Package: $VERSION"

          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag ($TAG) does not match package.json version ($VERSION)"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Publish package
        run: |
          npm publish \
            --access public \
            --provenance \
            --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    needs: publish

    # Runs on both a tag push AND a manual "Run workflow" dispatch.
    # On workflow_dispatch, github.ref_name is whatever branch the run was
    # triggered against (e.g. "main"), not a version tag, so tag_name below
    # is derived from package.json's version instead of github.ref_name to
    # stay correct in both cases.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false