# docker-compose.yml generated by Nova when dockerCompose feature is enabled
# Services: app (binds to local Dockerfile), optional postgres, redis, mailpit
version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - mailpit

# Additional services (only included when generator patches)
